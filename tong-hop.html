<!DOCTYPE html>
<html lang="vi" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Data Tool - Hợp Nhất & Đối Chiếu</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { 
                fontFamily: { sans: ['Inter', 'sans-serif'] },
                extend: { 
                    colors: { 
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    } 
                } 
            }
        };
        
        const currencyFormatter = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' });
        
        // --- GLOBAL VARIABLES ---
        let totalAccumulatedRevenue = 0;
        let processedFilesCount = 0;
        let fileList = [];
        let isProcessing = false;
        
        // Dữ liệu cho Master File
        let masterHeader = null; // Lưu dòng tiêu đề
        let masterRows = [];     // Lưu tất cả các dòng dữ liệu gộp lại

        // --- THEME LOGIC ---
        function setupTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const iconSvg = document.getElementById('theme-icon-svg');
            if (isDark) {
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
            } else {
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            }
        }

        // --- DATA PROCESSING LOGIC ---
        
        // Hàm đọc thủ công (Fallback)
        function manualReadSheet(worksheet) {
            const result = [];
            if (!worksheet['!ref']) return [];
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                let row = [];
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellAddress = XLSX.utils.encode_cell({c: C, r: R});
                    const cell = worksheet[cellAddress];
                    row.push(cell ? cell.v : undefined);
                }
                result.push(row);
            }
            return result;
        }

        function updateDisplay() {
            document.getElementById('total-revenue-display').textContent = currencyFormatter.format(totalAccumulatedRevenue);
            
            // Progress Bar
            const progressBar = document.getElementById('progress-bar');
            const percent = fileList.length > 0 ? (processedFilesCount / fileList.length) * 100 : 0;
            progressBar.style.width = `${percent}%`;
            
            // Status Text
            document.getElementById('status-text').textContent = `Đã xử lý ${processedFilesCount} / ${fileList.length} tệp`;
            document.getElementById('master-rows-count').textContent = `Tổng dòng dữ liệu: ${masterRows.length}`;

            // Nút Export
            const exportBtn = document.getElementById('export-master-btn');
            if (masterRows.length > 0) {
                exportBtn.disabled = false;
                exportBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                exportBtn.classList.add('hover:bg-brand-700', 'shadow-lg');
            } else {
                exportBtn.disabled = true;
                exportBtn.classList.add('opacity-50', 'cursor-not-allowed');
                exportBtn.classList.remove('hover:bg-brand-700', 'shadow-lg');
            }

            // Render List
            const listEl = document.getElementById('file-list-content');
            listEl.innerHTML = fileList.map((file, index) => {
                let statusBadge = '';
                // Logic badge trạng thái
                if (file.status === 'processing') statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/30 dark:text-blue-300">Đang đọc...</span>`;
                else if (file.error) statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-300">Lỗi</span>`;
                else if (file.isProcessed) statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300">OK</span>`;
                else statusBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300">Chờ</span>`;

                return `
                <tr class="border-b border-gray-100 dark:border-slate-700/50 hover:bg-gray-50 dark:hover:bg-slate-800/50 transition-colors">
                    <td class="p-3 text-xs text-gray-500 font-mono">${String(index + 1).padStart(2, '0')}</td>
                    <td class="p-3 text-xs font-medium text-gray-900 dark:text-slate-200 truncate max-w-[150px]" title="${file.name}">${file.name}</td>
                    <td class="p-3 text-xs text-right font-medium text-gray-900 dark:text-white">${file.displayRevenue || '-'}</td>
                    <td class="p-3 text-right">${statusBadge}</td>
                </tr>`;
            }).join('');
        }

        function handleFileSelection(event) {
            const newFiles = Array.from(event.target.files);
            if (newFiles.length === 0) return;
            
            const isAccumulateMode = document.getElementById('accumulate-mode').checked;
            let startIndex = 0;

            if (isAccumulateMode) {
                // Chế độ cộng dồn: Giữ nguyên masterRows và totalRevenue
                startIndex = fileList.length;
                const newEntries = newFiles.map(file => ({ 
                    name: file.name, file: file, isProcessed: false, error: false, status: 'pending', displayRevenue: '' 
                }));
                fileList = fileList.concat(newEntries);
            } else {
                // Chế độ làm mới: Reset tất cả
                totalAccumulatedRevenue = 0;
                processedFilesCount = 0;
                masterRows = []; // Reset dữ liệu Master
                masterHeader = null; // Reset header
                startIndex = 0;
                fileList = newFiles.map(file => ({ 
                    name: file.name, file: file, isProcessed: false, error: false, status: 'pending', displayRevenue: '' 
                }));
            }
            
            event.target.value = '';
            updateDisplay();
            
            if (!isProcessing) processNextFile(startIndex);
        }

        function processNextFile(index) {
            if (index >= fileList.length) {
                isProcessing = false;
                return;
            }
            
            isProcessing = true;
            const fileEntry = fileList[index];
            
            if (fileEntry.isProcessed) {
                processNextFile(index + 1);
                return;
            }

            fileEntry.status = 'processing';
            updateDisplay();

            const reader = new FileReader();
            reader.onload = (e) => {
                let revenueFromFile = 0;
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    let rows = [];
                    // Đọc dữ liệu
                    try {
                        if (XLSX.utils && XLSX.utils.sheet_to_aoa) {
                            rows = XLSX.utils.sheet_to_aoa(sheet, { header: 1 });
                        } else throw new Error('Lite mode');
                    } catch {
                        rows = manualReadSheet(sheet);
                    }

                    // --- XỬ LÝ MASTER DATA ---
                    if (rows.length > 0) {
                        // Nếu chưa có header (file đầu tiên), lấy dòng 0 làm header
                        if (!masterHeader) {
                            masterHeader = rows[0]; 
                        }
                        
                        // Lấy dữ liệu từ dòng 1 trở đi (bỏ header của file con)
                        // Lọc bỏ các dòng hoàn toàn trống để file Master sạch đẹp
                        const dataRows = rows.slice(1).filter(row => row.some(cell => cell !== undefined && cell !== null && cell !== ''));
                        masterRows.push(...dataRows);
                    }
                    // ------------------------

                    // --- XỬ LÝ DOANH THU (Cột M - Index 12) ---
                    const COL_M_INDEX = 12;
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row && row.length > COL_M_INDEX) {
                            const val = row[COL_M_INDEX];
                            let amt = 0;
                            if (typeof val === 'number') amt = val;
                            else if (typeof val === 'string') {
                                const clean = val.replace(/[^0-9]/g, '');
                                if (clean) amt = parseInt(clean, 10);
                            }
                            if (amt > 0) revenueFromFile += amt;
                        }
                    }

                    totalAccumulatedRevenue += revenueFromFile;
                    fileEntry.isProcessed = true;
                    fileEntry.displayRevenue = currencyFormatter.format(revenueFromFile);

                } catch (err) {
                    fileEntry.error = true;
                    console.error(err);
                } finally {
                    fileEntry.status = 'done';
                    processedFilesCount++;
                    updateDisplay();
                    setTimeout(() => processNextFile(index + 1), 5);
                }
            };
            reader.readAsArrayBuffer(fileEntry.file);
        }

        // --- EXPORT MASTER FILE FUNCTION ---
        function exportMasterFile() {
            if (masterRows.length === 0) {
                alert("Chưa có dữ liệu để xuất!");
                return;
            }

            // Gộp Header + Data Rows
            const finalData = [masterHeader || [], ...masterRows];

            // Tạo Workbook mới
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(finalData);

            // Tự động chỉnh độ rộng cột (Cơ bản)
            const wscols = [
                {wch: 5},  // A: STT
                {wch: 12}, // B: Ngày
                {wch: 20}, // C: Tên KH
                {wch: 25}, // D: Địa chỉ
                {wch: 15}, // E: MST
                {wch: 15}, // F: Người mua
                {wch: 20}, // G: Email
                {wch: 15}, // H: Hình thức
                {wch: 30}, // I: Tên hàng
                {wch: 10}, // J: ĐVT
                {wch: 10}, // K: SL
                {wch: 15}, // L: Đơn giá
                {wch: 15}  // M: Thành tiền
            ];
            ws['!cols'] = wscols;

            XLSX.utils.book_append_sheet(wb, ws, "TongHop_Master");

            // Tạo tên file có timestamp
            const date = new Date();
            const dateStr = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}`;
            const fileName = `MasterData_TongHop_${dateStr}.xlsx`;

            XLSX.writeFile(wb, fileName);
        }

        function toggleAccumulateMode() {
            const checkbox = document.getElementById('accumulate-mode');
            const label = document.getElementById('accumulate-label');
            const wrapper = document.getElementById('accumulate-wrapper');
            const statusDot = document.getElementById('accumulate-dot');

            if (checkbox.checked) {
                label.innerHTML = "Chế độ: <span class='font-bold text-brand-600 dark:text-brand-400'>CỘNG DỒN</span>";
                wrapper.className = "p-4 rounded-xl border transition-all bg-indigo-50 border-indigo-200 dark:bg-indigo-900/20 dark:border-indigo-700";
                statusDot.className = "h-2.5 w-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.6)]";
            } else {
                label.innerHTML = "Chế độ: <span class='font-medium text-gray-500 dark:text-gray-400'>LÀM MỚI</span>";
                wrapper.className = "p-4 rounded-xl border transition-all bg-white border-gray-200 dark:bg-slate-800 dark:border-slate-700";
                statusDot.className = "h-2.5 w-2.5 rounded-full bg-gray-300 dark:bg-gray-600";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupTheme();
            toggleAccumulateMode();
            updateDisplay();
        });
    </script>
</head>

<body class="bg-gray-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans selection:bg-brand-500 selection:text-white transition-colors duration-300">

    <nav class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-brand-600 p-2 rounded-lg text-white shadow-lg shadow-brand-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-slate-900 dark:text-white leading-none">Master Data Tool</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Hợp nhất & Đối chiếu dữ liệu</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="location.reload()" class="hidden sm:flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 dark:text-red-400 dark:bg-red-900/20 dark:hover:bg-red-900/40 rounded-lg transition-colors">
                    Reset
                </button>
                <button onclick="toggleTheme()" class="p-2 rounded-lg text-slate-500 hover:bg-gray-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-all">
                    <svg id="theme-icon-svg" class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                
                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 p-6">
                    <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase mb-4 tracking-wide">1. Tác vụ</h2>
                    
                    <div class="relative group w-full h-40 rounded-xl border-2 border-dashed border-gray-300 dark:border-slate-600 hover:border-brand-500 dark:hover:border-brand-400 hover:bg-brand-50 dark:hover:bg-slate-700/50 transition-all flex flex-col items-center justify-center text-center cursor-pointer overflow-hidden mb-4">
                        <input type="file" multiple accept=".xlsx, .xls" onchange="handleFileSelection(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <div class="p-4 group-hover:scale-105 transition-transform duration-300">
                            <div class="w-10 h-10 mb-2 mx-auto bg-blue-50 dark:bg-slate-700 rounded-full flex items-center justify-center text-brand-600 dark:text-brand-400">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            </div>
                            <span class="text-sm font-bold text-brand-600 dark:text-brand-400">Chọn File Báo Cáo</span>
                            <p class="text-xs text-slate-400 mt-1">Hỗ trợ Ctrl+A nhiều file</p>
                        </div>
                    </div>

                    <button id="export-master-btn" onclick="exportMasterFile()" disabled class="w-full py-3 px-4 bg-brand-600 text-white rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Tải Master File (Gộp)
                    </button>
                    <p class="text-center text-xs text-slate-400 mt-2" id="master-rows-count">Tổng dòng dữ liệu: 0</p>
                </div>

                <div id="accumulate-wrapper" class="p-4 rounded-xl border border-gray-200 bg-white dark:bg-slate-800 dark:border-slate-700 shadow-sm">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-2">
                            <div id="accumulate-dot" class="h-2 w-2 rounded-full bg-gray-300"></div>
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Cài đặt</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="accumulate-mode" class="sr-only peer" onchange="toggleAccumulateMode()">
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-brand-600"></div>
                        </label>
                    </div>
                    <p id="accumulate-label" class="text-sm text-slate-700 dark:text-slate-300 mb-1">Chế độ: Làm mới</p>
                    <p class="text-xs text-slate-400">Bật để cộng dồn khi chọn thêm file.</p>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                
                <div class="bg-gradient-to-br from-white to-gray-50 dark:from-slate-800 dark:to-slate-800/50 rounded-2xl shadow-lg border border-gray-200 dark:border-slate-700 p-6 sm:p-8 relative overflow-hidden">
                    <div class="relative z-10">
                        <h2 class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1">Tổng Doanh Thu Đối Chiếu</h2>
                        <div id="total-revenue-display" class="text-4xl sm:text-5xl md:text-6xl font-extrabold text-slate-900 dark:text-white tracking-tight">0 ₫</div>
                        
                        <div class="mt-6 flex items-center gap-4">
                            <div class="flex-1">
                                <div class="flex justify-between text-xs font-medium text-slate-500 mb-1.5">
                                    <span id="status-text">Đang chờ file...</span>
                                </div>
                                <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
                                    <div id="progress-bar" class="bg-brand-600 dark:bg-brand-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 flex flex-col h-[500px]">
                    <div class="p-4 border-b border-gray-200 dark:border-slate-700 bg-gray-50/50 dark:bg-slate-800 flex justify-between items-center rounded-t-xl">
                        <h3 class="font-bold text-slate-700 dark:text-slate-200 text-sm uppercase tracking-wide">Chi tiết file</h3>
                    </div>
                    
                    <div class="overflow-y-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead class="sticky top-0 bg-white dark:bg-slate-800 z-10 shadow-sm">
                                <tr>
                                    <th class="p-3 text-xs font-bold text-slate-500 uppercase w-12 pl-4">#</th>
                                    <th class="p-3 text-xs font-bold text-slate-500 uppercase">Tên File</th>
                                    <th class="p-3 text-xs font-bold text-slate-500 uppercase text-right">Doanh thu</th>
                                    <th class="p-3 text-xs font-bold text-slate-500 uppercase text-right pr-4">TT</th>
                                </tr>
                            </thead>
                            <tbody id="file-list-content" class="divide-y divide-gray-100 dark:divide-slate-700/50">
                                <tr>
                                    <td colspan="4" class="p-10 text-center text-slate-400 italic">Chưa có dữ liệu.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
